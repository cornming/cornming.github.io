- name: IC 卡控制
  en: ic-card-home
  status: v0.3.1
  categories: [android]
  summary: 用手機 NFC 讀家裡閒置的 IC 卡，依對照表控制 Google Home 裡的開關類裝置。已在現場實測：刷卡、按下確認後，大門的繼電器確實點動開門。
  highlights:
    - 預設「試運行」只寫記錄；名稱含「門、鎖」的裝置預設擋下，門禁類裝置刷卡後先跳確認視窗，10 秒沒確認就取消
    - 程式裡只用 OnOff（開關）功能，沒有任何送出鎖定或解鎖的路徑；同一張卡 2 秒內重複感應只算一次
    - App 沒開時刷卡，由系統叫起 App 走同一條流程；只採用系統送來的 Tag 物件，不信任 intent 自帶的 ID
    - App 內檢查 GitHub Release，下載後驗證套件名稱、版本與簽章才交給系統安裝
  tech: [Kotlin, Jetpack Compose, NFC, Google Home APIs]
  icon: "🔑"
  accent: "#0f766e"
  links:
    - label: 下載 APK
      url: https://github.com/cornming/ic-card-home/releases
    - label: 原始碼
      url: https://github.com/cornming/ic-card-home

- name: NFC 讀卡驗證
