  status: v0.3.2
  categories: [android]
  summary: 「IC 卡控制」的前身：先回答手上這張閒置 IC 卡手機讀不讀得到、UID 穩不穩定、能不能拿來當鑰匙，再讓每張登錄的卡各自綁一個動作。
