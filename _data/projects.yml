# ─────────────────────────────────────────────────────────────
# 作品清單：首頁的作品牆會照這裡的順序顯示。
# 新增作品＝複製一段、改內容、推上 GitHub，一兩分鐘後網站就會更新。
#
# 欄位說明
#   name        作品名稱（必填）
#   en          副標，例如英文名或 repo 名（選填）
#   categories  分類 key，可以填多個，對應 _data/categories.yml（必填）
#   summary     一兩句話的介紹（必填）
#   highlights  重點，建議 2～4 點（選填）
#   tech        使用的技術，會顯示成小標籤（選填）
#   image       封面圖，建議 16:10，放在 assets/img/projects/（選填）
#   icon        沒有封面圖時，封面中間顯示的 emoji（選填）
#   accent      沒有封面圖時，封面的主色（選填）
#   status      顯示在名稱旁邊的小字，例如版本號（選填）
#   links       按鈕：label 是文字，url 是網址；第一個會是主要按鈕（選填）
# ─────────────────────────────────────────────────────────────

- name: 叮咚！便利店
  en: dingdong-mart
  categories: [game, web]
  summary: 向九〇年代末台灣便利商店經營遊戲致敬的原創網頁遊戲。一九九九年的夏天，你頂下巷口的一間小店，進貨、排班、對付奧客，把它變成整條街最亮的招牌。
  highlights:
    - 手機直式畫面優先，打開瀏覽器就能玩，也能建置成單一 HTML 檔離線玩
    - 三個城市、各商圈客層不同，30 天後依總資產頒發銅、銀、金牌，存到 300 萬可以退休或開分店
    - 店面用 canvas 向量繪圖，音樂和音效用 WebAudio 即時合成，沒有任何音檔
    - 線上排行榜與留言板，後端是一份 Google 試算表加 Apps Script
  tech: [JavaScript, Canvas, WebAudio, Google Apps Script, GitHub Actions]
  image: /assets/img/projects/dingdong-mart.jpg
  links:
    - label: 線上玩
      url: https://cornming.github.io/dingdong-mart/
    - label: 原始碼
      url: https://github.com/cornming/dingdong-mart

- name: 3D 魔物獵人 Web 原型
  en: mh-3d-web
  categories: [game, web]
  summary: 用 Three.js 和 Web Audio API 做的純前端 3D 動作遊戲原型，不用 Node.js、不用建置工具，打開網頁就能玩。
  highlights:
    - 大劍和雙劍兩種武器可以切換，有輕攻擊連段、依蓄力時間分級的重斬、翻滾無敵時間，還有回覆藥和砥石
    - 魔物會追蹤玩家，有甩尾、龍吼和狂暴狀態，頭、角、尾巴都可以被破壞
    - 模型是用 Blender 腳本產生的 GLB，音效全部用 Web Audio API 即時合成，沒有外部音檔
    - 鍵盤、滑鼠、觸控按鈕都能操作，支援目標鎖定與自由視角；戰績存在 localStorage
  tech: [JavaScript, Three.js, Web Audio API, Blender, PowerShell]
  icon: "⚔️"
  accent: "#ef4444"
  links:
    - label: 線上玩
      url: https://cornming.github.io/mh-3d-web/
    - label: 原始碼
      url: https://github.com/cornming/mh-3d-web

- name: SlowJog
  en: slowjog
  status: v0.1.31
  categories: [android, web]
  summary: 陪你養成「早晨 30 分鐘運動＋超慢跑」習慣的 App。節拍器、階段式課表、語音口令、運動紀錄和習慣分數一次到位，有 Android 版，也有瀏覽器直接用的網頁版。
  highlights:
    - 超慢跑節拍器 40 到 240 BPM，Android 版用前景服務，鎖屏後仍會繼續；可以邊聽 Spotify 邊用
    - 暖身、超慢跑、肌力、伸展的階段式課表，階段最後 5 秒倒數、自動接續，做動作時有讀秒與換邊口令
    - 桌面小工具、每日提醒、習慣分數與每週目標，運動紀錄可匯出 CSV；沒有廣告、不追蹤
    - 網頁版用 Rust + Leptos 編譯成 WebAssembly，課表與統計邏輯從 Kotlin 版移植並附單元測試
    - 推上 main 會由 GitHub Actions 自動建置 APK 發佈到 Releases，App 內可直接檢查更新
  tech: [Kotlin, Jetpack Compose, Rust, Leptos, WebAssembly, Web Audio, GitHub Actions]
  image: /assets/img/projects/slowjog.jpg
  links:
    - label: 網頁版
      url: https://cornming.github.io/slowjog/
    - label: 下載 APK
      url: https://github.com/cornming/slowjog/releases
    - label: 原始碼
      url: https://github.com/cornming/slowjog

- name: 晚安瑜伽
  en: night-yoga
  status: v0.1.0
  categories: [web]
  summary: 睡前 5 到 15 分鐘的溫和伸展與呼吸引導網頁。免註冊、免下載，可以加到手機主畫面，離線也能用。
  highlights:
    - 三組睡前課程、十個溫和體式，示範圖是用關節角度即時畫出的人形動畫，貓牛式會跟著呼吸動
    - 4-7-8、延長吐氣、方塊呼吸三種呼吸引導，圓圈跟著吸吐縮放
    - 五種背景音樂用 Web Audio 即時合成，沒有音檔、沒有版權問題；語音優先播預錄的 Gemini TTS 檔，沒有才退回瀏覽器語音
    - 課程與體式都放在 JSON，改資料不用動程式；另附語音驗收工具，檢查語速、靜音與音量後再請 Gemini 聽寫評分
  tech: [Rust, Leptos, WebAssembly, Web Audio, PWA, Gemini TTS, GitHub Actions]
  image: /assets/img/projects/night-yoga.jpg
  links:
    - label: 線上試用
      url: https://cornming.github.io/night-yoga/
    - label: 原始碼
      url: https://github.com/cornming/night-yoga

- name: lens-tag
  categories: [android]
  summary: 用手機相機即時框出畫面中的物件，辨識後可以自訂名稱、翻譯成指定語言；之後看到同類物件會直接顯示存好的名稱。
  highlights:
    - 物件偵測用 ML Kit，辨識可選裝置端的 Gemini Nano（離線免費，限部分機型）或 Azure AI Foundry（較準、需網路），不用自己訓練分類模型
    - 雙語標籤、TTS 唸出名稱，看到的單字可以標記進單字本；也能拍一張照片，圈選任意範圍再辨識
    - 支援 cardboard VR 模式，戴著眼鏡用「凝視停留」操作
    - App 會自己檢查 GitHub Release，有新版直接在 App 內下載安裝
  tech: [Kotlin, Jetpack Compose, CameraX, ML Kit, Gemini Nano, Azure AI Foundry]
  icon: "🏷️"
  accent: "#22c55e"
  links:
    - label: 下載 APK
      url: https://github.com/cornming/lens-tag/releases
    - label: 原始碼
      url: https://github.com/cornming/lens-tag

- name: 走走冒險
  en: WalkAdventure
  status: V0.1
  categories: [android, game]
  summary: 「你走的每一步，都是遊戲進度。」用 Android 實際步數驅動的輕量冒險 RPG：走路拿經驗、升級、探索地圖、開寶箱。
