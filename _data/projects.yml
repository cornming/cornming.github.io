- name: 電池與 CPU 監看條
  en: BatteryCPUMonitor
  categories: [desktop]
  summary: 貼在螢幕邊緣的兩列迷你橫條，隨時看得到電池、CPU、記憶體、GPU、磁碟讀寫和網路速度。目標平台是 Windows 10/11（64 位元）。
  highlights:
    - 可以拖曳移動、記住位置，也能嵌進工作列、開機自動啟動、滑鼠穿透
    - CPU／GPU 溫度、功耗、頻率和風扇轉速是選用功能，需要系統管理員權限，預設關閉
    - 內建自動更新，下載後會先驗證 SHA-256 才安裝
  tech: [C#, .NET 10, Windows Forms, LibreHardwareMonitor, GitHub Actions]
  image: /assets/img/projects/battery-cpu-monitor.jpg
  links:
