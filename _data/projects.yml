- name: 每日英語上傳
  en: daily-english-uploader
  categories: [web]
  summary: 我自己經營的 YouTube 頻道「每日英語小故事」用的上傳自動化工具，透過 YouTube Data API 把每天做好的英語短片傳到自己的頻道。這個 repo 放的是工具的說明頁與隱私權政策，工具本身是個人使用、沒有對外公開。
