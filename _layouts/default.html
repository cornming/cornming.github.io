<!doctype html>
<html lang="{{ site.lang | default: 'zh-Hant' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {%- seo -%}
  <link rel="preconnect" href="https://avatars.githubusercontent.com" crossorigin>
  {%- if page.url contains '/stats/' %}
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  {%- endif %}
  <link rel="icon" href="{% include avatar-url.html size=64 %}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {%- feed_meta -%}
  <script>
    // 在畫面出現前套用使用者選過的主題，避免閃一下（僅接受 light / dark）
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  {%- include nav.html -%}
  <main id="main">
    {{ content }}
  </main>
  {%- include footer.html -%}
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
