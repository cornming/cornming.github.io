---
layout: default
---
<article class="container prose-wrap">
  <header class="post-header">
    <a class="back" href="{{ '/blog/' | relative_url }}">← 所有文章</a>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time>
      {%- if page.tags.size > 0 %} · {{ page.tags | join: '、' }}{% endif %}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
