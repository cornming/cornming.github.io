# ── 網站基本資訊 ─────────────────────────────
title: cornming
tagline: 作品集
description: cornming 的作品集：Android App、網頁工具、Chrome 擴充功能與桌面小工具，每一件都附上原始碼。
lang: zh-Hant
locale: zh_TW
timezone: Asia/Taipei

url: "https://cornming.github.io"
baseurl: ""

# ── 個人資訊（顯示在首頁與頁尾）────────────────
author:
  name: cornming
  location: 台灣
  github: cornming
  avatar: https://avatars.githubusercontent.com/u/19969233?v=4

# ── Ko-fi 贊助 ───────────────────────────────
# ★ 要換 Ko-fi 帳號，只要改這一行：填 https://ko-fi.com/ 後面的帳號名稱。
#   右下角懸浮按鈕與頁尾上方的支持卡片都會一起換成新網址（_includes/kofi-*.html）。
#   清空（kofi: ""）就會兩處都不顯示；單一頁面不想顯示，在該頁 front matter 加 kofi: false。
kofi: cornming

# 分享到社群時的預設圖片
logo: https://avatars.githubusercontent.com/u/19969233?v=4

# ── 使用統計 ─────────────────────────────────
# 晚安瑜伽、SlowJog 網頁版與 SlowJog Android「完成一次」時，會把匿名的一筆紀錄送到這個 Google Apps Script，
# /stats/ 頁面再從同一個網址讀回統計。程式碼與部署步驟見 apps-script/README.md。
stats_endpoint: "https://script.google.com/macros/s/AKfycbzN1cM7oU-eeatBeISxnm3n8CbYiQej-aOfmIGljFUAAFmRtcP-9NruWs8_RMkhsSpkVA/exec"

# ── 導覽列 ───────────────────────────────────
# 「文章」只有在 _posts/ 有文章時才會出現，不用在這裡設定
navbar:
  - title: 作品
    url: /#projects
  - title: 統計
    url: /stats/

# ── 建置設定（GitHub Pages 原生支援，不需要 Actions）──
# 版型全部自己寫，不套用 GitHub Pages 預設的 primer 佈景主題
theme: null
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
permalink: /blog/:year/:month/:day/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - apps-script
  - tests
